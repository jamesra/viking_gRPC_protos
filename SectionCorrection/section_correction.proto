syntax = "proto3";

option csharp_namespace = "Viking.SectionCorrectionServiceTypes.gRPC.V1.Protos";

package Viking.SectionCorrectionServiceTypes.gRPC.V1;

import "google/protobuf/timestamp.proto";

// Protocol V1, deprecated: new code uses section_correction_v2.proto. Served alongside V2 until installed Viking
// builds and SBFSEM-tools have moved, then removed.
//
// Multi-volume morphology residual vector fields after mosaic+Stos volume mapping.
// Catalogs files written under {root}/{volume_name}/{stos_group}/ by SectionCorrectionBuilder
// and the GrpcSectionCorrectionService rebuild loop.
// volume_name is the correction set's annotation database name (Identity AnnotationServer database; the
// context name when Identity has none). Annotation contexts that share a database and stos_group share one set.
// Viking learns the service URL, database name and stos_group (RegistrationName) from Identity per context.
// XY is volume nanometers (annotation DB units * AnnotateMetaData.Scale).
// Unknown volume_name or stos_group: NOT_FOUND. GetSectionCorrection for a Z with no map: NOT_FOUND.
service AnnotateSectionCorrections {
  // Identity volumes this host rebuilds, plus any volume folders already on disk.
  rpc ListVolumes (ListVolumesRequest) returns (ListVolumesResponse);

  // Last rebuild pass: in-progress flag, timestamps, last error, volume names attempted.
  rpc GetRebuildStatus (GetRebuildStatusRequest) returns (RebuildStatus);

  // Starts a rebuild in the background and returns at once; poll GetRebuildStatus for progress.
  // Only accepted from the service host itself (loopback), which is how the container's
  // correction-menu console reaches it. Other callers: PERMISSION_DENIED.
  rpc RebuildVolume (RebuildVolumeRequest) returns (RebuildVolumeResponse);

  // Published StosGroup correction sets. Empty volume_name lists every volume.
  rpc ListCorrectionSets (ListCorrectionSetsRequest) returns (ListCorrectionSetsResponse);

  // Z values that have a published map for this volume + StosGroup. Unknown pair: NOT_FOUND.
  rpc ListCorrectedSections (ListCorrectedSectionsRequest) returns (ListCorrectedSectionsResponse);

  // Builder provenance and the list of Z. Unknown pair: NOT_FOUND.
  rpc GetCorrectionManifest (GetCorrectionManifestRequest) returns (CorrectionManifest);

  // Sparse lattice for one section. Use to interpolate locally.
  // Unknown pair or Z with no map: NOT_FOUND ("no correction for section {z} in '{volume}' '{name}'").
  rpc GetSectionCorrection (GetSectionCorrectionRequest) returns (SectionCorrection);

  // Sample the field for XY grouped by section. Every point on a found section interpolates.
  // CorrectedXY.trusted is near-measurement support, not interpolation success.
  // Unknown pair: NOT_FOUND. Empty sections, a section with no points, or duplicate z: INVALID_ARGUMENT.
  rpc CorrectPoints (CorrectPointsRequest) returns (CorrectPointsResponse);

  // Load structure locations (and child structures when requested), then apply correction.
  // Neighbor samples the published residual field. CurveFit is leave-one-out Catmull-Rom
  // on the process graph. Omitted correction is All (Neighbor then CurveFit).
  rpc CorrectStructures (CorrectStructuresRequest) returns (CorrectStructuresResponse);

  // Current annotation fingerprint of structures, from SQL aggregates only (no volume load, no fit): milliseconds.
  // Compare annotation_fingerprint with the one a cached CorrectStructuresResponse carries; if they differ, or
  // service_version or the set's CorrectionProvenance.built_utc changed, re-fetch CorrectStructures.
  // Empty structure_ids: INVALID_ARGUMENT. Unknown volume_name: FAILED_PRECONDITION.
  rpc GetStructureFingerprint (GetStructureFingerprintRequest) returns (GetStructureFingerprintResponse);
}

// Same flag values as AnnotationVizLib.CorrectionMode. Unset on the request means All.
enum CorrectionMode {
  CORRECTION_MODE_NONE = 0;
  CORRECTION_MODE_NEIGHBOR = 1;
  CORRECTION_MODE_CURVE_FIT = 2;
  CORRECTION_MODE_ALL = 3;
}

message ListVolumesRequest {}

message ListVolumesResponse {
  repeated VolumeInfo volumes = 1;
}

message VolumeInfo {
  string volume_name = 1;
  string vikingxml_endpoint = 2;
  string annotation_endpoint = 3;
}

message GetRebuildStatusRequest {}

message RebuildStatus {
  bool in_progress = 1;
  google.protobuf.Timestamp last_started_utc = 2;
  google.protobuf.Timestamp last_completed_utc = 3;
  string last_error = 4;
  // Host assembly version. Changes on algorithm / CorrectStructures deploys even when
  // published field built_utc is unchanged. Use with CorrectionProvenance.built_utc to
  // invalidate CorrectStructures client caches.
  string service_version = 6;
  // Progress of the running (or last) rebuild. A group is one (database, StosGroup) correction set.
  string current_volume = 7;
  // Latest message from the builder for the group being built; empty when idle.
  string current_step = 8;
  int32 groups_done = 9;
  int32 groups_total = 10;
}

message RebuildVolumeRequest {
  // Annotation database name as listed by ListVolumes. Empty rebuilds every volume.
  string volume_name = 1;
  // Rebuild even when the published set is current (same as Rebuild:Force for this run).
  bool force = 2;
}

message RebuildVolumeResponse {
  // False when a rebuild is already running; message says why.
  bool started = 1;
  string message = 2;
}

message ListCorrectionSetsRequest {
  string volume_name = 1;
}

message ListCorrectionSetsResponse {
  repeated CorrectionSetInfo sets = 1;
}

message CorrectionSetInfo {
  string volume_name = 1;
  string stos_group = 2;
  CorrectionProvenance provenance = 3;
}

message ListCorrectedSectionsRequest {
  string volume_name = 1;
  string stos_group = 2;
}

message ListCorrectedSectionsResponse {
  repeated int64 z = 3;
}

message GetCorrectionManifestRequest {
  string volume_name = 1;
  string stos_group = 2;
}

message CorrectionProvenance {
  google.protobuf.Timestamp built_utc = 1;
  double pitch_nm = 3;
  double kernel_radius_nm = 4;
}

message CorrectionManifest {
  CorrectionProvenance provenance = 3;
  repeated int64 z = 5;
}

message GetSectionCorrectionRequest {
  string volume_name = 1;
  string stos_group = 2;
  int64 z = 3;
}

// Node (gx, gy) sits at (gx * pitch_nm, gy * pitch_nm) in volume nanometers.
message SectionCorrection {
  double pitch_nm = 6;
  repeated LatticeVector nodes = 7;
}

message LatticeVector {
  int32 gx = 1;
  int32 gy = 2;
  double dx = 3;
  double dy = 4;
  int32 vote_count = 5;
}

message VolumeXY {
  double x = 1;
  double y = 2;
}

message SectionPoints {
  int64 z = 1;
  repeated VolumeXY points = 2;
}

message CorrectPointsRequest {
  string volume_name = 1;
  string stos_group = 2;
  repeated SectionPoints sections = 3;
  optional CorrectionMode correction = 4;
}

message CorrectStructuresRequest {
  string volume_name = 1;
  string stos_group = 2;
  repeated int64 structure_ids = 3;
  bool include_children = 4;
  optional CorrectionMode correction = 5;
}

message CorrectedLocation {
  int64 location_id = 1;
  int64 structure_id = 2;
  int64 z = 3;
  double x = 4;
  double y = 5;
  double dx = 6;
  double dy = 7;
}

message CorrectStructuresResponse {
  string volume_name = 1;
  string stos_group = 2;
  repeated CorrectedLocation locations = 3;
  // Same as RebuildStatus.service_version — echo for CorrectStructures cache keys.
  string service_version = 4;
  // Newest location LastModified or LocationLink Created among the requested structures (and their children when
  // include_children was set), in UTC. Unset when they have no locations. It moves on every insert or edit but NOT
  // on a delete: removing a location or link leaves the newest remaining time unchanged. For staleness checks use
  // annotation_fingerprint, which also changes on a delete.
  google.protobuf.Timestamp annotation_watermark = 5;
  // Opaque; equal values mean the same annotation rows. Read before the rows, so an edit made during the call leaves
  // an older value here and the next GetStructureFingerprint check reports a change. Compare by string equality only.
  string annotation_fingerprint = 6;
}

message GetStructureFingerprintRequest {
  string volume_name = 1;
  repeated int64 structure_ids = 2;
  // Must match the CorrectStructuresRequest.include_children of the response being checked.
  bool include_children = 3;
}

message GetStructureFingerprintResponse {
  string volume_name = 1;
  // Same meaning as CorrectStructuresResponse.annotation_fingerprint / annotation_watermark.
  string annotation_fingerprint = 2;
  google.protobuf.Timestamp annotation_watermark = 3;
  // Same as RebuildStatus.service_version.
  string service_version = 4;
}

message CorrectedXY {
  double x = 1;
  double y = 2;
  double dx = 3;
  double dy = 4;
  bool trusted = 5;
}

message CorrectedSection {
  int64 z = 1;
  bool found_section = 2;
  repeated CorrectedXY points = 3;
}

message CorrectPointsResponse {
  string volume_name = 1;
  string stos_group = 2;
  repeated CorrectedSection sections = 3;
}
