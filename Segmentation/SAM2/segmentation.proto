syntax = "proto3";

option csharp_namespace = "Viking.gRPC.SegmentationServiceTypes.V1";

package segmentation;

// Service for segmenting images using SAM2
service SegmentationService {
  // Upload an image to the server cache and receive a unique ID
  rpc UploadImage (UploadImageRequest) returns (UploadImageResponse) {}
  // Upload one 1024x1024 grid cell. A repeat of the same TileCoord with identical bytes
  // refreshes the cache entry and does not re-encode.
  rpc UploadTile (UploadTileRequest) returns (UploadTileResponse) {}
  // Segment using uploaded grid cells. The server owns the request: it grows the mask over the
  // cells it has, then streams TilesNeeded for the cells the mask reached that it does not have,
  // waits for the client's TilesAnswer, and continues the same growth with them. When nothing more
  // is needed it streams the finished SegmentationResponse and ends the call.
  // The client sends exactly one `start`, then one `answer` per TilesNeeded.
  //
  // Ending: after `result` the call ends OK. A client that cancels gets no result (the call is gone).
  // A client that leaves TilesNeeded unanswered for the server's idle limit (default 60 s) gets
  // DEADLINE_EXCEEDED. Other statuses: INVALID_ARGUMENT for a malformed conversation or request,
  // NOT_FOUND ("TILE_NOT_FOUND row=.. col=..") when a tile holding a foreground point is not cached,
  // FAILED_PRECONDITION ("NO_MATCHING_MASK ...") when the starting cell yields no mask that fits the
  // prompt, RESOURCE_EXHAUSTED when the request is over the server's size limits, UNAVAILABLE when the
  // GPU is lost. This RPC replaced the unary SegmentTiles, which no longer exists.
  rpc SegmentTilesStream (stream SegmentTilesStreamRequest) returns (stream SegmentTilesStreamResponse) {}
  // Segment an image based on input coordinates (uses cached image_id or inline image_data)
  rpc SegmentImage (SegmentationRequest) returns (SegmentationResponse) {}
  // Auto-segmentation: each request message is one independent point set for image_id.
  // The server writes one SegmentationResponse per set as soon as that predict() finishes.
  // The first message must carry image_id. Later messages reuse it when image_id is 0.
  rpc SegmentImageSets (stream SegmentImageSetRequest) returns (stream SegmentationResponse) {}
  // Segment an image using a dictionary mapping IDs to points (id=0 for background, id!=0 for foreground)
  rpc MultiSegmentImage (MultiSegmentationRequest) returns (SegmentationResponse) {}
  // Delete a cached image from the server
  rpc DeleteImage (DeleteImageRequest) returns (DeleteImageResponse) {}
  // Return version, uptime, and a short status message for health/selection UI
  rpc GetServerStatus (ServerStatusRequest) returns (ServerStatusResponse) {}
}

// Request to upload an image to the server cache
message UploadImageRequest {
  bytes image_data = 1;

  // Image width
  int32 width = 2;

  // Image height
  int32 height = 3;
}

// Response containing the cached image ID
message UploadImageResponse {
  uint64 image_id = 1;
}

// Stable identity of one 1024x1024 cell at a pyramid downsample.
// This is the reusable cross-client cache key (not a sequential image_id).
// Row and column are floor(world / (1024 * downsample)); row increases with world Y.
message TileCoord {
  string volume = 1;
  int32 section = 2;
  string channel = 3;
  string transform = 4;
  int32 downsample = 5;
  int32 row = 6;
  int32 col = 7;
}

message UploadTileRequest {
  TileCoord coord = 1;
  bytes image_data = 2;
  int32 width = 3;
  int32 height = 4;
}

message UploadTileResponse {
  // True when this TileCoord was already encoded and the bytes were unchanged.
  // Clients address tiles by Coord on SegmentTilesStream; no image_id is returned.
  bool already_cached = 1;
}

// Points are mosaic pixels at the tiles' downsample: X right, Y up (world / downsample).
// The server refuses a request over its limits with RESOURCE_EXHAUSTED, naming the limit: by default
// 64 tiles, 512 foreground plus background points, and 16 boxes (see the server README).
message SegmentTilesRequest {
  repeated TileCoord tiles = 1;
  repeated Point foreground = 2;
  repeated Point background = 3;
  bool multimask_output = 4;
  bool omit_labeled_image = 5;
  // Logit above which a pixel is object. Higher values shrink the mask; lower values grow it.
  // Optional so the server can tell an omitted field (it then uses its own default, 1.0) from an explicit 0.
  optional float mask_threshold = 6;
  // When true, each cell prediction is run twice: the second pass is given the first
  // pass's low-resolution logits as SAM2's mask_input along with the same prompts.
  bool use_mask_input = 7;
  // SAM2 box prompts in mosaic pixels (same frame as the points). When present the server uses exactly
  // these boxes and sends exactly the foreground points given, instead of looking for nine-click
  // circles to box. A window uses the box with the most area inside it; SAM2 takes one box per call.
  repeated BoundingBox foreground_boxes = 8;
  // Client-issued ticket, echoed in SegmentationResponse.request_id and written to the server log and
  // debug dump so one client log line can be matched to one server result. The server does not order
  // or cancel by it: only the client knows which of its requests is still wanted. 0 means not set.
  uint64 request_id = 9;
}

// Client to server on SegmentTilesStream.
message SegmentTilesStreamRequest {
  oneof body {
    // Must be the first message and the only one of its kind.
    SegmentTilesRequest start = 1;
    // Reply to the latest TilesNeeded.
    TilesAnswer answer = 2;
  }
}

// What the client did about a TilesNeeded. Every requested tile must appear in exactly one list,
// across one or more answers; the server waits until each has been answered.
message TilesAnswer {
  // Tiles that were uploaded with UploadTile and are now cached.
  repeated TileCoord ready = 1;
  // Tiles the client could not supply (capture failed, off the volume). Growth does not enter them.
  repeated TileCoord unavailable = 2;
}

// Server to client on SegmentTilesStream.
message SegmentTilesStreamResponse {
  oneof update {
    // Upload these, then send a TilesAnswer. The server waits for it.
    TilesNeeded needed = 1;
    // The finished mask. The server ends the call after sending it.
    SegmentationResponse result = 2;
  }
}

message TilesNeeded {
  repeated TileCoord tiles = 1;
}

// Request to delete a cached image
message DeleteImageRequest {
  uint64 image_id = 1;
}

// Response after deleting a cached image
message DeleteImageResponse {
  bool success = 1;
}

// What a model wants its input to be. The client picks the RPCs and decides what a camera move
// invalidates from this, instead of hard-coding one model.
enum SubmissionMode {
  // Never sent. proto3 requires a zero value; a client rejects it.
  SUBMISSION_MODE_UNSPECIFIED = 0;
  // Fixed 1024x1024 cells on a grid anchored at the volume origin, sent with UploadTile and
  // SegmentTiles. Cells are rendered without overlays and keyed by TileCoord, so they are shared
  // across clients and a result does not depend on where the camera is.
  SUBMISSION_MODE_FIXED_TILE_GRID = 1;
  // The whole screen as the user sees it, sent with UploadImage and SegmentImage. The image depends
  // on the viewport rectangle and zoom, so any view move makes an earlier result stale.
  SUBMISSION_MODE_FULL_VIEWPORT = 2;
}

// Whether the pyramid downsample sent with FIXED_TILE_GRID can change as the user zooms.
// Not consulted for FULL_VIEWPORT, whose scale is always the camera's.
enum ResolutionMode {
  // Never sent. proto3 requires a zero value; a client rejects it.
  RESOLUTION_MODE_UNSPECIFIED = 0;
  // One downsample (1). Every tile key is the same at every zoom.
  RESOLUTION_MODE_SINGLE = 1;
  // The client may submit a coarser downsample when zoomed out. Crossing a level changes every
  // tile key, so work submitted at the old level is stale.
  RESOLUTION_MODE_MULTI = 2;
}

// How one model wants to be fed. Today the server reports the single loaded model; a list of
// named models is expected to reuse this message.
message ModelCapabilities {
  SubmissionMode submission_mode = 1;
  ResolutionMode resolution_mode = 2;
}

message ServerStatusRequest {}

message ServerStatusResponse {
  string version = 1;
  double uptime_seconds = 2;
  string message = 3;
  // Concurrent Upload/Segment/MultiSegment RPCs currently in flight
  uint32 in_flight_requests = 4;
  uint32 cached_images = 5;
  uint64 cache_memory_bytes = 6;
  // Exponential moving average of Upload/Segment/MultiSegment duration
  double recent_latency_ms = 7;
  uint32 inference_workers = 8;
  // How the loaded model wants its input submitted. Always set.
  ModelCapabilities capabilities = 9;
  // Which image encoder new embeddings are made with right now: "eager" or "compiled".
  // Starts "eager" and becomes "compiled" once the background torch.compile encoder has passed its
  // numeric check against the eager one and been swapped in. Empty when the model does not report it.
  string encoder_generation = 10;
  // State of the background encoder compile: "off", "warming", "ready" or "failed".
  string compile_status = 11;
}

// Request message containing the image and coordinates for single-point segmentation
message SegmentationRequest {
  // Fast path: ID from UploadImage. Non-zero skips set_image() and runs predict() only.
  // Use 0 or omit to send inline image_data (re-encodes on every request).
  uint64 image_id = 1;
  // Image bytes used only when image_id is 0. Ignored when image_id is non-zero.
  bytes image_data = 2;
  int32 width = 3;
  int32 height = 4;
  repeated Point coordinates = 5;
  repeated int32 labels = 6;
  bool multimask_output = 7;
  // When true, skip the full-frame labeled image PNG. Viking does not use it.
  bool omit_labeled_image = 8;
}

// One independent auto-segmentation prompt set for a cached image.
message SegmentImageSetRequest {
  // Cached image from UploadImage. Required on the first message of the stream.
  // Zero on a later message reuses the image_id from the first message.
  uint64 image_id = 1;
  repeated Point foreground = 2;
  repeated Point background = 3;
  bool multimask_output = 4;
}

// Request message for segmenting with multiple labeled points (id=0 for background, id!=0 for foreground)
message MultiSegmentationRequest {
  // Fast path: ID from UploadImage. Non-zero skips set_image() and runs predict() only.
  // Use 0 or omit to send inline image_data (re-encodes on every request).
  uint64 image_id = 1;
  // Image bytes used only when image_id is 0. Ignored when image_id is non-zero.
  bytes image_data = 2;
  int32 width = 3;
  int32 height = 4;
  // Map of label ID to foreground point (id=0 = background, id!=0 = foreground object)
  map<int32, Point> foreground_points = 5;
  bool multimask_output = 6;
  // When true, skip the full-frame labeled image PNG. Viking does not use it.
  bool omit_labeled_image = 7;
}

// Point coordinates
message Point {
  int32 x = 1;
  int32 y = 2;
}

// Axis-aligned rectangle, inclusive corners, in the same pixel frame as Point (X right, Y up).
message BoundingBox {
  int32 x_min = 1;
  int32 y_min = 2;
  int32 x_max = 3;
  int32 y_max = 4;
}

// Polygon representation as a list of points: the outer boundary of one connected piece of a mask.
// Coordinates are integer pixel indices in the mask's own frame (X right, Y down from the top), the
// OpenCV contour convention: point (x, y) is the centre of the pixel in column x, row y, so the traced
// ring runs through pixel centres, half a pixel inside the true pixel edge. A client that places the
// mask by pixel edges (as Viking does with the mask PNG) should add 0.5 to a polygon point to compare
// the two.
message Polygon {
  repeated Point points = 1;
  // Interior rings (holes) of this piece, each a closed ring in the same pixel frame as `points`.
  // Empty for a solid piece. Added after the first release, so an older client simply never reads it.
  // A hole is only listed when it is larger than the server's small-hole threshold (3% of the mask
  // area); smaller holes are filled in the mask before it is traced.
  repeated Polygon holes = 2;
}

// Response message containing the segmentation results
message SegmentationResponse {
  // Labeled image where each pixel value corresponds to a segment index
  bytes labeled_image = 1;

  // Width of the labeled image
  int32 width = 2;

  // Height of the labeled image
  int32 height = 3;

  // List of segment results
  repeated SegmentResult segments = 4;

  // Bottom-left of the fused mosaic in downsample pixels (Y increases upward).
  // SegmentImage leaves these at 0; the mosaic is the uploaded viewport.
  int32 origin_x = 5;
  int32 origin_y = 6;

  // Was requested_tiles; growth now asks for cells with TilesNeeded on SegmentTilesStream.
  reserved 7;
  reserved "requested_tiles";

  // SegmentTilesRequest.request_id echoed back. 0 when the request carried none.
  uint64 request_id = 8;
}

// Information about a single segment
message SegmentResult {
  // Index of the segment in the labeled image
  int32 index = 1;

  // Confidence score for this segment (0.0 to 1.0)
  float score = 2;

  // Binary mask for this segment (optional, may be omitted to save bandwidth)
  bytes mask = 3;
  // Top-left X of the mask in image coordinates
  int32 x = 4;
  // Top-left Y of the mask in image coordinates
  int32 y = 5;

  // List of polygons representing the contours of this segment
  repeated Polygon polygons = 6;
}
