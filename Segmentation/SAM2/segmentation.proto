syntax = "proto3";

option csharp_namespace = "Viking.gRPC.SegmentationServiceTypes.V1";

package segmentation;

// Service for segmenting images using SAM2
service SegmentationService {
  // Upload an image to the server cache and receive a unique ID
  rpc UploadImage (UploadImageRequest) returns (UploadImageResponse) {}
  // Segment an image based on input coordinates (uses cached image_id or inline image_data)
  rpc SegmentImage (SegmentationRequest) returns (SegmentationResponse) {}
  // Segment an image using a dictionary mapping IDs to points (id=0 for background, id!=0 for foreground)
  rpc MultiSegmentImage (MultiSegmentationRequest) returns (SegmentationResponse) {}
  // Delete a cached image from the server
  rpc DeleteImage (DeleteImageRequest) returns (DeleteImageResponse) {}
}

// Request to upload an image to the server cache
message UploadImageRequest {
  bytes image_data = 1;

  // Image width
  int32 width = 2;

  // Image height
  int32 height = 3;
}

// Response containing the cached image ID
message UploadImageResponse {
  uint64 image_id = 1;
}

// Request to delete a cached image
message DeleteImageRequest {
  uint64 image_id = 1;
}

// Response after deleting a cached image
message DeleteImageResponse {
  bool success = 1;
}

// Request message containing the image and coordinates for single-point segmentation
message SegmentationRequest {
  // Optional: ID of a previously uploaded image (use 0 or omit to send inline image_data)
  uint64 image_id = 1;
  // Grayscale image data as bytes (used when image_id is 0 or for backward compatibility)
  bytes image_data = 2;
  int32 width = 3;
  int32 height = 4;
  repeated Point coordinates = 5;
  repeated int32 labels = 6;
  bool multimask_output = 7;
  // When true, skip the full-frame labeled image PNG. Viking does not use it.
  bool omit_labeled_image = 8;
}

// Request message for segmenting with multiple labeled points (id=0 for background, id!=0 for foreground)
message MultiSegmentationRequest {
  // Optional: ID of a previously uploaded image (use 0 or omit to send inline image_data)
  uint64 image_id = 1;
  // Grayscale image data as bytes (used when image_id is 0 or for backward compatibility)
  bytes image_data = 2;
  int32 width = 3;
  int32 height = 4;
  // Map of label ID to foreground point (id=0 = background, id!=0 = foreground object)
  map<int32, Point> foreground_points = 5;
  bool multimask_output = 6;
  // When true, skip the full-frame labeled image PNG. Viking does not use it.
  bool omit_labeled_image = 7;
}

// Point coordinates
message Point {
  int32 x = 1;
  int32 y = 2;
}

// Polygon representation as a list of points
message Polygon {
  repeated Point points = 1;
}

// Response message containing the segmentation results
message SegmentationResponse {
  // Labeled image where each pixel value corresponds to a segment index
  bytes labeled_image = 1;

  // Width of the labeled image
  int32 width = 2;

  // Height of the labeled image
  int32 height = 3;

  // List of segment results
  repeated SegmentResult segments = 4;
}

// Information about a single segment
message SegmentResult {
  // Index of the segment in the labeled image
  int32 index = 1;

  // Confidence score for this segment (0.0 to 1.0)
  float score = 2;

  // Binary mask for this segment (optional, may be omitted to save bandwidth)
  bytes mask = 3;
  // Top-left X of the mask in image coordinates
  int32 x = 4;
  // Top-left Y of the mask in image coordinates
  int32 y = 5;

  // List of polygons representing the contours of this segment
  repeated Polygon polygons = 6;
}
